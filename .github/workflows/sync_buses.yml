name: Sync Live 6670 Bus Data

on:
  schedule:
    # 台灣日間營運時段 (UTC 22:00 ~ 14:00，即台灣時間 06:00 ~ 22:00)，每 10 分鐘自動同步一次
    - cron: '*/10 22-23,0-14 * * *'
    # 台灣夜間收班時段 (UTC 15:00 ~ 21:00，即台灣時間 23:00 ~ 05:00)，每小時同步確認收班
    - cron: '0 15-21 * * *'
  workflow_dispatch: # 支援在 GitHub 網頁手動一鍵觸發立即同步

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install requests

      - name: Fetch Latest TDX Bus Data
        run: |
          python sync_live_6670.py

      - name: Commit and Push if Changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/live_buses.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto sync 6670 bus data [skip ci]" && git push)
